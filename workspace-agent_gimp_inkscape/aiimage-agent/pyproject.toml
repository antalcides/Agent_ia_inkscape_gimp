[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-image-agent"
version = "1.0.0"
description = "Agente de IA que crea y repara imágenes con Inkscape (vectores) y GIMP (bitmaps), con modelos locales o en la nube"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AI Image Agent contributors" }]
keywords = ["inkscape", "gimp", "svg", "vector", "imagen", "agente", "ia", "automation", "script-fu"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
  "Topic :: Multimedia :: Graphics :: Editors :: Vector-Based",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# SIN dependencias en runtime: urllib + tkinter + xml.etree (por eso el .exe y el Flatpak son triviales)
dependencies = []

[project.optional-dependencies]
icon = ["Pillow>=10"]          # regenerar assets/icon.ico / .icns / .png
build = ["pyinstaller>=6.0", "Pillow>=10"]
dev = ["pyinstaller>=6.0", "Pillow>=10", "PyYAML>=6"]

[project.urls]
Documentation = "https://inkscape.org/doc/"
Changelog = "https://github.com/arena/ai-image-agent/releases"

[project.scripts]
ai-image-agent-cli = "aiimage_agent.cli:main"

[project.gui-scripts]
ai-image-agent = "aiimage_agent.app:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["aiimage_agent*"]

[tool.setuptools.package-data]
aiimage_agent = ["../assets/icon.ico", "../assets/icon.png"]

[tool.ruff]
line-length = 118
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "UP038", "B008", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"scripts/gui_probe.py" = ["E402"]

[tool.pytest.ini_options]   # por si alguien prefiere pytest; unittest sigue siendo el runner real
testpaths = ["tests"]
