name: Construir ejecutable de Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprobar tkinter
        run: python -c "import tkinter; print('tkinter OK')"

      - name: Instalar PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Empaquetar el ejecutable
        run: python -m PyInstaller --clean --noconfirm packaging/windows/agent.spec --distpath dist --workpath build

      - name: Subir el ejecutable como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: AgenteIA-Inkscape-GIMP-exe
          path: dist/AgenteIA-Inkscape-GIMP.exe
          if-no-files-found: error

      - name: Adjuntar a la Release (solo en etiquetas)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AgenteIA-Inkscape-GIMP.exe
